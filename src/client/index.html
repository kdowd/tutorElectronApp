<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Special App - Client</title>
    <script src="prism.js"></script>
    <link rel="stylesheet" href="prism.css" />
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        color: white;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      .column {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding: 20px;
        transition: background-color 0.3s ease;
      }
      .left {
        background-color: rebeccapurple;
        border-right: 2px solid rgba(255, 255, 255, 0.1);
      }
      #fileList li {
        padding: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        transition: background-color 0.2s;
      }
      #fileList li:hover {
        background-color: rgba(255, 255, 255, 0.2);
        cursor: pointer;
      }
      .right {
        background-color: #2c3e50;
        justify-content: center;
      }
      h1 {
        font-size: 2.5rem;
        margin: 10px 0;
      }
      .display-container {
        width: 95%;
        height: 85vh;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #messageDisplay {
        margin: 0;
        padding: 20px;
        flex: 1;
        overflow-y: auto;
      }
      /* Override Prism default background to match our container */
      pre[class*="language-"] {
        margin: 0 !important;
        background: transparent !important;
        height: 100%;
      }
      .status {
        position: absolute;
        bottom: 10px;
        font-size: 0.8rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="column left">
      <h1>My Special App</h1>
      <p>LAN Client Interface</p>
      <div id="folderInfo" style="margin-top: 20px; text-align: left; width: 100%; display: none">
        <h3 id="folderTitle" style="border-bottom: 1px solid rgba(255, 255, 255, 0.3); padding-bottom: 5px"></h3>
        <ul id="fileList" style="list-style: none; padding: 0; max-height: 60vh; overflow-y: auto"></ul>
      </div>
    </div>
    <div class="column right" id="rightColumn">
      <div class="display-container">
        <pre id="messageDisplay"><code id="codeBlock" class="language-plaintext">Click a file to view its contents...</code></pre>
      </div>
      <div class="status" id="status">Connected to host</div>
    </div>

    <!-- <script src="prism.js"></script> -->
    <script>
      const eventSource = new EventSource("/events");
      const codeBlock = document.getElementById("codeBlock");
      const rightColumn = document.getElementById("rightColumn");
      const status = document.getElementById("status");
      const folderInfo = document.getElementById("folderInfo");
      const folderTitle = document.getElementById("folderTitle");
      const fileList = document.getElementById("fileList");

      // Map extensions to Prism language classes
      const langMap = {
        js: "javascript",
        html: "markup",
        css: "css",
        cpp: "cpp",
        h: "cpp",
        hpp: "cpp",
        json: "json",
        md: "markdown",
        txt: "plaintext",
      };

      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.message && !data.files) {
          updateDisplay(`Broadcast: ${data.message}`, "plaintext");
          flashRightColumn();
        }

        if (data.folderName && data.files) {
          folderInfo.style.display = "block";
          folderTitle.innerText = `Folder: ${data.folderName}`;
          fileList.innerHTML = "";
          data.files.forEach((file) => {
            const li = document.createElement("li");
            li.innerText = file;
            li.onclick = () => {
              fetchFileContent(file);
            };
            fileList.appendChild(li);
          });
          updateDisplay(`New folder loaded: ${data.folderName}`, "plaintext");
          flashRightColumn();
        }
      };

      async function fetchFileContent(filename) {
        updateDisplay(`Loading ${filename}...`, "plaintext");
        try {
          const response = await fetch(`/read-file?filename=${encodeURIComponent(filename)}`);
          const data = await response.json();
          if (data.success) {
            const ext = filename.split(".").pop().toLowerCase();
            const lang = langMap[ext] || "plaintext";
            updateDisplay(data.content, lang);
          } else {
            updateDisplay(`Error: ${data.error}`, "plaintext");
          }
        } catch (err) {
          updateDisplay(`Failed to fetch file content: ${err.message}`, "plaintext");
        }
      }

      function updateDisplay(content, lang) {
        codeBlock.className = `language-${lang}`;
        codeBlock.textContent = content;

        // Safety check if Prism failed to load
        if (typeof Prism !== "undefined") {
          Prism.highlightElement(codeBlock);
        } else {
          console.error("Prism not loaded yet.");
        }
      }

      function flashRightColumn() {
        const originalColor = rightColumn.style.backgroundColor;
        rightColumn.style.backgroundColor = "gold";
        setTimeout(() => {
          rightColumn.style.backgroundColor = originalColor;
        }, 500);
      }

      eventSource.onerror = () => {
        status.innerText = "Disconnected from host";
        status.style.color = "#ff4757";
      };
    </script>
  </body>
</html>
