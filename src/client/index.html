<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Special App - Client</title>

    <link rel="stylesheet" href="./highlight/styles/default.min.css" />
    <link rel="stylesheet" href="./highlight/styles/github-dark-dimmed.min.css" />

    <script src="./highlight/highlight.min.js"></script>
    <script src="./highlight/languages/css.min.js"></script>
    <script src="./highlight/languages/php-template.min.js"></script>
    <script src="./highlight/languages/markdown.min.js"></script>

    <script>
      hljs.registerLanguage("php-template", phpTemplate);
      // hljs.registerLanguage("php", php);
      hljs.registerLanguage("cpp", cpp);
      hljs.registerLanguage("css", css);
      hljs.registerLanguage("html", html);
      hljs.registerLanguage("javascript", javascript);
      hljs.registerLanguage("json", json);
      hljs.registerLanguage("markdown", markdown);
      hljs.registerLanguage("plaintext", plaintext);
      hljs.registerLanguage("python", python);
      hljs.highlightAll();
    </script>

    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        color: lime;
        /* text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5); */
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      #messageDisplay code.hljs {
        font-size: 0.9rem;
      }
      .column {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding: 20px;
        transition: background-color 0.3s ease;
      }
      .left {
        background-color: rebeccapurple;
        border-right: 2px solid rgba(255, 255, 255, 0.1);
      }
      #fileList li {
        padding: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        transition: background-color 0.2s;
      }
      #fileList li:hover {
        background-color: rgba(255, 255, 255, 0.2);
        cursor: pointer;
      }
      .right {
        background-color: #2c3e50;
        justify-content: center;
      }
      h1 {
        font-size: 2.5rem;
        margin: 10px 0;
      }
      .display-container {
        width: 95%;
        height: 85vh;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #messageDisplay {
        margin: 0;
        padding: 20px;
        flex: 1;
        overflow-y: auto;
      }
      /* Override default background to match our container */
      pre[class*="language-"] {
        margin: 0 !important;
        background: transparent !important;
        height: 100%;
      }
      .status {
        position: absolute;
        bottom: 10px;
        font-size: 0.8rem;
        opacity: 0.7;
      }
      div.code,
      #codeBlock {
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="column left">
      <h1>My Special App</h1>
      <p>LAN Client Interface</p>
      <div id="folderInfo" style="margin-top: 20px; text-align: left; width: 100%; display: none">
        <h3 id="folderTitle" style="border-bottom: 1px solid rgba(255, 255, 255, 0.3); padding-bottom: 5px"></h3>
        <ul id="fileList" style="list-style: none; padding: 0; max-height: 60vh; overflow-y: auto"></ul>
      </div>
    </div>
    <div class="column right" id="rightColumn">
      <div class="display-container">
        <pre id="messageDisplay">
          <code id="codeBlock" class="">
     

        </code>
      </pre>
      </div>
      <div class="status" id="status">Connected to host</div>
    </div>

    <script>
      const eventSource = new EventSource("/events");
      const codeBlock = document.getElementById("codeBlock");
      const rightColumn = document.getElementById("rightColumn");
      const status = document.getElementById("status");
      const folderInfo = document.getElementById("folderInfo");
      const folderTitle = document.getElementById("folderTitle");
      const fileList = document.getElementById("fileList");

      // Map extensions to Highlight.js language classes
      const langMap = {
        js: "javascript",
        html: "html",
        css: "css",
        cpp: "cpp",
        h: "cpp",
        hpp: "cpp",
        json: "json",
        md: "markdown",
        txt: "plaintext",
        php: "php",
        py: "python",
      };

      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.message && !data.files) {
          updateDisplay(`Broadcast: ${data.message}`, "plaintext");
          flashRightColumn();
        }

        if (data.folderName && data.files) {
          updateFolderUI(data.folderName, data.files);
          updateDisplay(`New folder loaded: ${data.folderName}`, "plaintext");
          flashRightColumn();
        }
      };

      async function fetchFileContent(filename) {
        updateDisplay(`Loading ${filename}...`, "plaintext");
        try {
          const response = await fetch(`/read-file?filename=${encodeURIComponent(filename)}`);
          const data = await response.json();
          if (data.success) {
            const ext = filename.split(".").pop().toLowerCase();
            const lang = langMap[ext] || "plaintext";

            updateDisplay(data.content, lang);
          } else {
            updateDisplay(`Error: ${data.error}`, "plaintext");
          }
        } catch (err) {
          updateDisplay(`Failed to fetch file content: ${err.message}`, "plaintext");
        }
      }

      function updateFolderUI(folderName, files) {
        folderInfo.style.display = "block";
        folderTitle.innerText = `Folder: ${folderName}`;
        fileList.innerHTML = "";
        files.forEach((file) => {
          const li = document.createElement("li");
          li.innerText = file;
          li.onclick = () => {
            fetchFileContent(file);
          };
          fileList.appendChild(li);
        });
      }

      async function checkInitialState() {
        try {
          const response = await fetch("/current-folder");
          const data = await response.json();
          if (data && data.folderName && data.files) {
            updateFolderUI(data.folderName, data.files);
            updateDisplay(`Connected to host. Showing active folder: ${data.folderName}`, "plaintext");
          }
        } catch (err) {
          console.error("Failed to fetch initial state:", err);
        }
      }

      // Check for current directory on load
      window.addEventListener("DOMContentLoaded", checkInitialState);

      function updateDisplay(content, lang) {
        codeBlock.className = `language-${lang} hljs`;
        codeBlock.textContent = content;
        codeBlock.removeAttribute("data-highlighted");
        hljs.highlightElement(codeBlock);
        //)
        // setTimeout(() => {
        //   hljs.highlightElement(codeBlock);
        // }, 1000);
      }

      function flashRightColumn() {
        const originalColor = rightColumn.style.backgroundColor;
        rightColumn.style.backgroundColor = "gold";
        setTimeout(() => {
          rightColumn.style.backgroundColor = originalColor;
        }, 500);
      }

      eventSource.onerror = () => {
        status.innerText = "Disconnected from host";
        status.style.color = "#ff4757";
      };
    </script>
  </body>
</html>
