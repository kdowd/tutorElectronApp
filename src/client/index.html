<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Special App - Client</title>

    <link rel="stylesheet" href="./highlight/styles/default.min.css" />
    <link rel="stylesheet" href="./highlight/styles/obsidian.min.css" />
    <!-- <link rel="stylesheet" href="./highlight/styles/base16/atlas.min.css" /> -->
    <!-- <link rel="stylesheet" href="./highlight/styles/tokyo-night-dark.min.css" /> -->
    <script src="./highlight/highlight.min.js"></script>
    <script src="./highlight/languages/css.min.js"></script>
    <script src="./highlight/languages/php-template.min.js"></script>
    <script src="./highlight/languages/markdown.min.js"></script>
    <script src="./highlight/languages/http.min.js"></script>
    <script src="./highlight/languages/javascript.min.js"></script>
    <script src="./highlight/languages/json.min.js"></script>
    <script src="./highlight/languages/scss.min.js"></script>
    <script src="./highlight/languages/typescript.min.js"></script>
    <script src="./highlight/languages/cpp.min.js"></script>
    <script src="./highlight/languages/c.min.js"></script>

    <script>
      hljs.highlightAll();
    </script>

    <link rel="stylesheet" href="./client.css" />
  </head>
  <body>
    <div class="column left">
      <h4>Remote Project View:</h4>
      <div class="status" id="status">Connected to host</div>

      <div id="folderInfo" style="margin-top: 20px; text-align: left; width: 100%; display: none">
        <h3 id="folderTitle" style="border-bottom: 1px solid rgba(255, 255, 255, 0.3); padding-bottom: 5px"></h3>
        <ul id="fileList" style="list-style: none; padding: 0; max-height: 60vh; overflow-y: auto"></ul>
      </div>
    </div>
    <div class="column right" id="rightColumn">
      <div class="display-container">
        <pre id="messageDisplay">
          <code id="codeBlock" class="">
              waiting for server update.....

        </code>
      </pre>
      </div>
    </div>

    <script>
      const eventSource = new EventSource("/events");
      const codeBlock = document.getElementById("codeBlock");
      const rightColumn = document.getElementById("rightColumn");
      const status = document.getElementById("status");
      const folderInfo = document.getElementById("folderInfo");
      const folderTitle = document.getElementById("folderTitle");
      const fileList = document.getElementById("fileList");

      // Map extensions to Highlight.js language classes
      const langMap = {
        js: "javascript",
        html: "html",
        css: "css",
        cpp: "cpp",
        h: "cpp",
        hpp: "cpp",
        json: "json",
        md: "markdown",
        txt: "plaintext",
        php: "php",
        py: "python",
      };

      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.message && !data.files) {
          // If the user is currently NOT viewing a file, show the broadcast message
          // Otherwise, we just let the message pass so it doesn't interrupt reading
          if (!currentViewingFile) {
            updateDisplay(`Broadcast: ${data.message}`, "plaintext");
          }
          flashRightColumn();
        }

        if (data.folderName && data.files) {
          updateFolderUI(data.folderName, data.files);
          // Only show "New folder loaded" if we aren't currently viewing a file
          if (!currentViewingFile) {
            updateDisplay(`New folder loaded: ${data.folderName}`, "plaintext");
          }
          flashRightColumn();
        }
      };

      let currentViewingFile = null;

      async function fetchFileContent(filename) {
        currentViewingFile = filename;
        updateDisplay(`Loading ${filename}...`, "plaintext");
        try {
          const response = await fetch(`/read-file?filename=${encodeURIComponent(filename)}`);
          const data = await response.json();
          if (data.success) {
            const ext = filename.split(".").pop().toLowerCase();
            const lang = langMap[ext] || "plaintext";

            updateDisplay(data.content, lang);
          } else {
            updateDisplay(`Error: ${data.error}`, "plaintext");
          }
        } catch (err) {
          updateDisplay(`Failed to fetch file content: ${err.message}`, "plaintext");
        }
      }

      function updateFolderUI(folderName, files) {
        folderInfo.style.display = "block";
        folderTitle.innerText = `Folder: ${folderName}`;
        fileList.innerHTML = "";
        files.forEach((file) => {
          const li = document.createElement("li");
          li.innerText = file;
          li.onclick = () => {
            fetchFileContent(file);
          };
          fileList.appendChild(li);
        });
      }

      async function checkInitialState() {
        try {
          const response = await fetch("/current-folder");
          const data = await response.json();
          if (data && data.folderName && data.files) {
            updateFolderUI(data.folderName, data.files);
            updateDisplay(`Connected to host. Showing active folder: ${data.folderName}`, "plaintext");
          }
        } catch (err) {
          console.error("Failed to fetch initial state:", err);
        }
      }

      // Check for current directory on load
      window.addEventListener("DOMContentLoaded", checkInitialState);

      function updateDisplay(content, lang) {
        if (!content || content.trim() === "") {
          codeBlock.innerHTML = "<i>File is empty - No content to show</i>";
          codeBlock.className = "hljs";
          return;
        }
        codeBlock.className = `language-${lang} hljs`;
        codeBlock.textContent = content;
        codeBlock.removeAttribute("data-highlighted");
        hljs.highlightElement(codeBlock);
      }

      function flashRightColumn() {
        const originalColor = rightColumn.style.backgroundColor;
        const root = document.documentElement;
        const style = getComputedStyle(root);
        const primaryColor = style.getPropertyValue("--flash-colour").trim();

        rightColumn.style.backgroundColor = primaryColor;
        setTimeout(() => {
          rightColumn.style.backgroundColor = originalColor;
        }, 500);
      }

      eventSource.onerror = () => {
        status.innerText = "Disconnected from host";
        status.style.color = "#ff4757";
      };
    </script>
  </body>
</html>
