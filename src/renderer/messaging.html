<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Messaging - My Special App</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/custom.css" />
    <style>
      .messaging-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin-top: 100px;
      }
      #messageInput {
        width: 80%;
        max-width: 400px;
        padding: 10px;
        font-size: 1.1rem;
        border: 2px solid #ccc;
        border-radius: 5px;
      }
      #sendBtn {
        font-size: 1.5rem;
        padding: 20px 40px;
        background-color: #28a745;
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }
      #sendBtn:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <div id="serverStatusBar">Local Network Address: Detecting...</div>
    <div class="messaging-container">
      <h1>Global Messaging</h1>
      <p>Type your message below and click "Send Now" to broadcast to all LAN clients.</p>
      <input type="text" id="messageInput" placeholder="Enter message here..." />
      <button id="sendBtn">Send Now</button>
      <p id="msgStatus"></p>
    </div>
    <script src="messaging.js"></script>
  </body>
</html>
